name: Verify and publish gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Locate Chromium
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Run protocol and browser tests
        run: |
          test -x "$CHROME_PATH"
          npm test
      - run: npm run gallery
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
